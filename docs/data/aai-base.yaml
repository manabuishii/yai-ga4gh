- id: AB-08
  tech: OAuth 2.0
  tech_detail: OAuth 2.0
  ref: RFC 6749 3.3 / OIDC Core 3.1.2.1
  file: rfc6749.txt
  relation: added
  item: scope ga4gh_passport_v1
  base: scope は認可サーバーが定める、空白区切りで大文字小文字を区別する文字列の並び。値の意味は決めていない。
  base_at:
    section: '3.3'
    quote: delimited, case-sensitive strings.  The strings are defined by the
  ga4gh: scope に ga4gh_passport_v1 という値を定め、それを含む OIDC の access token を PSAT と呼ぶ。PSAT の scope クレームは openid と ga4gh_passport_v1 を含む MUST。
  ga4gh_at:
  - - aai/AAIConnectProfile.md
    - including the identifier `ga4gh_passport_v1`.
  - - aai/AAIConnectProfile.md
    - '`scope`: REQUIRED. Includes verified scopes. MUST include `openid` and `ga4gh_passport_v1`.'
  confidence: 原文
  note: scope クレーム自体は RFC 8693 4.2 の定義をそのまま使う(AAI「The `scope` [Claim](#term-claim) is defined by [section 4.2]」、rfc8693.txt 762 行)。openid を含むのは OIDC Core の「OpenID Connect requests MUST contain the openid scope value」(core 1509 行)をトークンのクレームにも写したもの
  links:
