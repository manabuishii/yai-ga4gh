unknowns_title: 作らないと分からないもの(試験で確かめる)
gaps:
- id: G-DRS-01
  section: drs
  kind: 漏れ
  body: ホスト名型 URI は https・443 固定で、ポートを含むのは不正。**手元の試験(http・別ポート)では仕様どおりに解決できない**。開発・試験の環境の扱いが無い
  source: '`drs/openapi/tags/DrsApiPrinciples.md:42`'
  yai: 4 つまとめた試験は TLS の 443(手元の CA)で仕様どおりに。単体の試験だけ「ホスト名 → URL」の上書き表を解決役に渡す(D-017)。**試験の環境でも手元の CA で仕様どおりにできる。仕様の文に開発・試験の環境の扱いが書かれていないだけ**
  check: 原文
  where:
  - a56
- id: G-DRS-02
  section: drs
  kind: 漏れ
  body: compact identifier 型は identifiers.org・n2t.net への登録が前提(サーバーは MUST)。登録しない私的な運用での解決のしかたが無い(付録に「外のサイトに頼らない運用もありうる」とだけ)
  source: '`DrsApiPrinciples.md:66`、`CompactIdentifierBasedURIs.md:65`'
  yai: yai は compact 型を**出さない**。解決役は手元の解決表(`prefix → URL パターン`)で解決する。試験用 prefix `yaitest.drs` は実在の prefix と重ならないことを identifiers.org で確かめてから使う(仮)
  check: 原文
  where:
  - a56
