- id: G-DRS-15
  section: drs
  kind: 漏れ
  body: '**壊れた資格情報と無い ID が重なったとき、401 と 404 のどちらを返すか**(確かめる順)が決まっていない。GetObject・PostObject・GetAccessURL・PostAccessURL の応答の一覧には 401・403・404 が並ぶだけで、説明は「The request is unauthorized.」「The requested `DrsObject` wasn''t found.」だけ。認可の方針は実装が決めて執行する、とあるだけ(コードのレビューで見つけた、2026-10-16)'
  source: '`drs/openapi/paths/objects@{object_id}.yaml:42・46`(GetObject の 401・404)、`:70・74`(PostObject)、`drs/openapi/paths/objects@{object_id}@access@{access_id}.yaml:16・20・49・53`、`drs/openapi/components/responses/401Unauthorized.yaml:1`、`404NotFoundDrsObject.yaml:1`、`drs/openapi/tags/Auth.md:3`'
  yai: '**資格情報の検査(壊れていれば 401)→ 有るか(404)→ 方針(401・403)**(案 A、D-025)。壊れた資格情報を黙って無視しない(`permissions.yaml` の public の note)と合う。どちらの順でも、資格情報なしで ID の有無が分かるのは同じ(資格情報なしの無い ID は 404)。GA4GH への質問の下書き: `docs/questions/2026-10-16_drs-401-vs-404.md`(投稿していない)'
  check: 原文
  where:
  - drs
  - ch
