  body: Auth 節と `PassportAuth` の説明は「`tokens[]` 配列」、操作の本文の定義は `passports`
  source: '`drs/openapi/data_repository_service.openapi.yaml:144`、`drs/openapi/tags/Auth.md:60`、`components/requestBodies/Passports.yaml:7`'
  yai: 操作の定義(`passports`)を正とする(計画 第 2 版から)。`tokens` で来たら 400(黙って読まない)
