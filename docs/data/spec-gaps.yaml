# 2026-10-16 に、それまで手で書いていた docs/spec-gaps.md から写した(D-028)。
# kind: 食い違い / 漏れ / 古い / 組み合わせ。check: 原文 / 作る / ほか(そのまま表に出す)
# where: 図(docs/data/diagram.yaml)のどの箱・矢印の問題か。1 つ以上
# 文字列の中の `…`・**…** は Markdown のまま(md にはそのまま、HTML では道具が直す)
sections:
  - {key: drs, title: DRS 1.5.0}
