problems:
  - id: TRE-01
    rank: 3
    title: 出力の持ち出し審査に標準が無い
    certainty: policy
    standard: 無い。TES・WES の outputs は審査を経ずに置き場へ書く前提。SATRE は手順・担当を持てと求め、Five Safes RO-Crate は記録の形だけ
    impl: 5S-TES(TRE の MinIO に置いて Egress App で審査)・Azure TRE(airlock の状態の流れ)・Lifebit・Genomics England が自前で持つ。形はばらばらで、5S-TES は審査の結果を Five Safes RO-Crate に書かない。DNAnexus・Verily は審査せずフラグ・境界で止める
    owner: 許可はデータを持つ機関(SATRE 3.1.06)、作業は計算の運用者。文書で揺れる
    idea: TES の出力を審査待ちの置き場に書き、審査の結果を Five Safes RO-Crate の Disclosure として残す(推定)
    where: [n-egress, n-review-store, r-16, r-17a, r-17b, a12, r-19, n-malware-scan]
    gaps: [G-WES-04]
  - id: TRE-02
    rank: 5
    title: DAC の承認から Visa を出すまでのつなぎが無い
    certainty: open
    standard: Passport は Visa の形だけ。DACReS に Passport の語が無い。DUO と Visa をつなぐ記述も無い
    impl: REMS(試験的)・DUOS が承認から ControlledAccessGrants を出す。どちらも Visa に DUO を入れない。LS Login が REMS から Visa を取りに行く登録は手作業(メール)
    owner: 承認は DAC、Visa Issuer を置くかはデータを持つ機関
    idea: 承認の記録(プロジェクト・人・期限)から Visa を作る対応表を決める(推定)
    where: [n-dac-procedure, r-14, r-12, m4]
    gaps: [G-AAI-06, G-TES-01]
  - id: TRE-03
    rank: 4
    title: 監査記録の形式と保存が無い
    certainty: policy
    standard: DRS・TES・WES に記録の欄・API が無い。DSIP(Dormant)と SATRE は残せと言うだけ
    impl: 5S-TES・Azure TRE はそれぞれ独自の記録(審査者・時刻・送った JSON)。共通の形は無い。商用は「audit trail あり」と書くだけ(推定)
    owner: 計算の運用者とデータを持つ機関に分かれる(推定)
    idea: アクセスの発行・Task の作成・出力の承認を 1 つの形で残す(Provenance Crate に寄せる案、推定)
    where: [n-audit, r-18a, r-18b]
    gaps: [G-WES-01, G-AAI-06, G-TES-05]
  - id: TRE-04
    title: 実行環境の隔離(通信・資源の上限)の欄が無い
    certainty: policy
    standard: TES の tesResources に通信の遮断の欄が無い。SATRE 2.1.14・2.2.10・2.2.11(M)
    impl: Funnel・TESK は既定で通信を遮断しない(Funnel の Docker に --network なし、TESK に NetworkPolicy なし、ram_gb は requests だけ)。Azure TRE は Firewall で既定拒否。5S-TES は一時的な資格情報と OPA で DB への道を限る
    owner: 計算の運用者
    idea: service-info で隔離の程度を出す独自の項目(推定)
    where: [n-sandbox, t1, tes, n-ephemeral-creds]
    gaps: [G-TES-01]
  - id: TRE-05
    rank: 1
    title: 取り消しの空白時間
    certainty: open
    standard: Visa に失効の仕組みが無い(MAY)、署名付き URL は期限まで使える。yai では最長約 2 時間
    impl: sda はキャッシュが既定 3600 秒で、その間は取り消したトークンも通る(文書)。REMS は承認・取り消しを外へ POST できる(届け先は決まっていない)。Azure TRE は承認した持ち出しを後から取り消せる
    owner: DAC が外す → データを持つ機関が止める。間を取り持つ仕組みが無い
    idea: 期限を短く/TRE の中では URL を外に出さない(推定)
    where: [m6, r-14, drs, bytes, r-rems-push]
    gaps: [G-X-02, G-DRS-10, G-TES-05]
  - id: TRE-06
    title: 機関をまたぐ責任分界が決まっていない
    certainty: open
    standard: 4 つの仕様は役割(サービス)を決めるが、どの組織が持つかは決めない。SATRE は役割だけ、Data Visiting は「provider の環境」とだけ
    impl: 5S-TES は層ごとに Keycloak の realm を分ける。Azure TRE は Airlock Manager を誰にするか導入側に任せる。Genomics England は運用者=データを持つ機関
    owner: 3 者(研究者の所属機関・計算の運用者・データを持つ機関)+連合の調整役
    idea: 枠ごとに「誰が持つか」を図に出し、未定は曖昧と書く(この図の役目)
    where: [B-OPS, B-AAI, B-FED, n-egress]
    gaps: [G-AAI-03]
  - id: TRE-07
    rank: 2
    title: TRE の外から 4 つを直接呼べる
    certainty: open
    standard: DRS は Bearer を認め、TES の tes_uri を直接読め、DRS を直接使える。TRE では研究者がバイト列に触れないのが前提なのに、仕様は止めない
    impl: Azure TRE は外から触れる置き場を 1 つ(公開 stage)に限る。Funnel は認証なしで動かせる、TESK は既定が認証なし
    owner: データを持つ機関・計算の運用者
    idea: TRE では a15・a16 を閉じ、/access を TRE の中の実行役にだけ出す(推定)
    where: [a15, a16, client]
    gaps: [G-AAI-01, G-DRS-13, G-WES-04]
  - id: TRE-08
    title: 連合(複数の TRE)での振り分けの欄が無い
    certainty: open
    standard: TES・WES は 1 つのサーバーの API。どの TRE で動かすかの欄が無い
    impl: 5S-TES だけが tags.tres と TRE Agent の取りに行く同期(pull)で振り分ける。Lifebit は「federated Airlock」を宣伝(裏付けなし)
    owner: 連合の調整役(新)
    idea: 5S-TES の tags の使い方を GA4GH 側に持ち込むかの検討(下書きだけ、推定)
    where: [B-FED, r-21, r-20, r-pull, n-tre-agent]
    gaps: [G-AAI-03]

heavy_gaps:
  - {gap: G-X-02, tre: [TRE-05], why: 出し済みの署名付き URL は期限まで使える。TRE では権限を外したらすぐ止めることが求められる}
  - {gap: G-DRS-10, tre: [TRE-05], why: URL の期限がクライアントに分からない。TRE の運用者が持ち出しの窓の長さを管理できない}
  - {gap: G-AAI-01, tre: [TRE-07], why: DRS が何の Bearer を受けるかが決まっていない。TRE の外から DRS を直接呼べる経路が残る}
  - {gap: G-DRS-13, tre: [TRE-07], why: OPTIONS が認証なしで、オブジェクトの有無が誰にでも分かる。TRE では有無そのものが漏れになりうる}
  - {gap: G-WES-04, tre: [TRE-01, TRE-07], why: tes_uri を読む資格情報が決まっていない。研究者が TES を直接読み、ログ・出力の場所を知る経路になる}
  - {gap: G-TES-05, tre: [TRE-03, TRE-05], why: 入力の資格情報の欄が無く、署名付き URL を TES に渡すしかない。URL がログに残ると TRE の外へ持ち出せる}
  - {gap: G-WES-01, tre: [TRE-03], why: 資格情報の受け渡しが対象外。誰の権限で DRS を読んだかが WES の記録に残らない}
  - {gap: G-AAI-03, tre: [TRE-06, TRE-08], why: Passport の aud が任意。連合の別の TRE へ持ち込まれても区別できない}
  - {gap: G-AAI-06, tre: [TRE-02, TRE-03], why: Passport と Visa の sub が違いうる。承認された人と実行した人が同じかを監査で示せない}
  - {gap: G-TES-01, tre: [TRE-02, TRE-04], why: TES に誤りの応答が無い。承認されていない Project・隔離の条件に合わない Task を断る返し方が決まっていない}

