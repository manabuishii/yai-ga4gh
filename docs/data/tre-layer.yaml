# TRE の層の図の原本。docs/diagram.html の「TRE の層」は、ここから tools/gen_diagram.py(検査と描き方は tools/gen_tre.py)で作る(手で直さない)。
# 調べの元: 非公開の調査メモ 2026-10-16(公式の文書、観測 2026-10-16)と
#            projects/yai/notes/2026-10-20_tre-implementations.md(実装、観測 2026-10-20)。決まりは D-045〜D-052。
#
# 枠・箱・矢印の ID が docs/data/diagram.yaml にあるもの(4 つの図にもあるもの)は、名前・確かさ・向きをそちらから取る(ここに書かない)。
#   4 つの図の箱は「仕様で決まっている」として扱う(GA4GH の仕様・AAI の図にある部品)。
# 新しいもの: 箱は n-、矢印は r-、枠は B-。certainty(確かさ、D-045):
#   spec   = 仕様で決まっている(実線)。src(公式の文書の url・quote・seen)か at(specs/ の原文)が要る
#   policy = 方針だけ(指針・推奨はあるが手順・形式は無い。一点鎖線)。src が要る
#   yai    = yai が仮に決めた(点線)。decision が要る
#   open   = 誰も決めていない=曖昧(斜線・点線)。reason と、src・at・impl のどれかが要る
#   公式の出典(src)は specs/ に固定していない文書なので、道具は形(url・観測日)だけ確かめる(D-045)
# safes: Five Safes の札(D-046)。people・projects・settings・data・outputs
# impl: 実装の根拠(D-050)。{by: 下の impls の ID, basis: code|release|running|docs, url, seen, note, guess: 任意}
#   商用(kind: commercial)の根拠は文書だけなので、いつも「推定」になる(道具が付ける)
# 重ね合わせ(D-049): 公式にある=certainty が spec か policy、実装にある=impl が 1 つ以上。道具が決める
# owner: 持ち主が揺れる・決まっていないときに書く(箱は 1 つの枠に入れるので、入れた枠と違う候補をここに)

note: >-
