# 4 つ(WES・TES・DRS・AAI)と人・組織の関係図の原本。docs/diagram.html はここから tools/gen_diagram.py で作る(手で直さない)。
# 問題(G-xxx)は docs/data/spec-gaps.yaml の where で、ここの箱・矢印の ID を指す。AAI の元の技術は docs/data/aai-base.yaml。
#
# certainty(確かさ。図の見た目を変える):
#   spec = 仕様で決まっている(実線)。at: [[specs/ からの相対パス, 原文の 1 行の中の文字列]] が必須(道具が原文を探す)
#   yai  = yai が仮に決めた(点線)。decision: D-xxx が必須(docs/decisions.md に有ること)
#   open = 誰も決めていない=曖昧(斜線+「曖昧」の札)。reason と at(仕様の外と書いてある所、など)が必須
# 枠(boundaries)は組織。箱(boxes)は部品か人で、必ず 1 つの枠に入る。x・y・w・h は図の座標(viewBox 1080×860)。
# 矢印(arrows): kind=call(呼び出し)/trust(信頼・責任の関係で、呼び出しではない)。sys=docs/design/system.md 4 節の番号。
#   枠をまたぐ矢印は responsible(誰が何に責任を持つか)が必須。via は折れ点([x, y] の並び、任意)。
#   tag_at は番号の札を置く位置(線の長さの割合、既定 0.5。札が重ならないように手で決める)。
#   badge_at は C の行・試験の件数の札の左上を、番号の札の中心からずらす量 [dx, dy](既定は札の真下。混む所だけ手で決める)。
# tests: docs/test-plan.md の試験(と system.md 9 節の INT-…)を箱・矢印・問題に結ぶ欄(D-032)。形は
#   {id, plan: どこに書いた試験か, stage: 段階(test-plan の書き方のまま), targets: [箱・矢印の ID], gaps: [G-xxx],
#    c_rows: [C-xx](E2E-10 のように C の行をまとめて持つとき), pytest: [make check で動く試験の関数名],
#    status: 通過|一部|失敗|未実施, partial: 一部の理由, note: 任意}
#   status は事実だけ: pytest が無いか全部が飛ばされたら未実施(D-036)、build/junit.xml で 1 つでも落ちれば失敗、飛ばされたものがあるか
#   partial を書いたら一部、ほかは通過。tools/test_status.py が make check の最後に junit と突き合わせる(推定で通過にしない)
#   C の行が試験を指すとき、その行の where は試験の targets に含まれていること(道具が確かめる)

yai_note: >-
  yai は学習用で、自分だけが使う(D-002)。GA4GH では別々の組織になりうる枠を、yai では 1 人の運用者がまとめて持つ。
  枠は GA4GH の役割で描き、yai でどうしているかは各枠の「yai では」に書く。

boundaries:
  - id: B-HOME
    name: 研究者の所属機関
    x: 300
    y: 20
    w: 480
    h: 130
    certainty: spec
    at:
      - [aai/AAIConnectProfile.md, "service that provides to users an identity, authenticates it, and provides"]
      - [aai/AAIConnectProfile.md, "eRA Commons. IdPs MAY be [Visa Assertion Sources]"]
    role: 本人確認(IdP)と、所属・役割の主張(Visa Assertion Source)。Visa に署名するとは限らない
    yai: yai は試験用の利用者表(alice・bob・carol)で代わりにする。所属の Visa は作らない(ControlledAccessGrants だけ)
  - id: B-RES
    name: 研究者(システムの利用者)
    x: 20
    y: 190
    w: 240
    h: 150
    certainty: spec
    at:
      - [aai/AAIConnectProfile.md, "box \"Researcher\"  #eee"]
    role: 研究者本人と、本人が使うクライアント(試験のコード・curl・他の実装のクライアント)
    yai: 試験のコードがクライアント
  - id: B-AAI
    name: Broker の運営者
    x: 300
    y: 190
    w: 480
    h: 150
    certainty: open
    reason: 公式の図は「AAI」という枠に入れるだけで、どの組織が運営するか(所属機関・データを持つ機関・第三者)は決めていない。Visa Issuer と 1 つにしてもよい
    at:
      - [aai/AAIConnectProfile.md, "box \"AAI\""]
      - [aai/AAIConnectProfile.md, "service that handles the responsibilities of both the Visa Issuer and"]
    role: 利用者の本人確認を取りまとめ、Visa を集め、Passport に署名して出す
    yai: yai-aai の試験用 Broker+Passport Issuer(認可コードの流れを持たないので Broker としては適合しない、G-AAI-09)
  - id: B-DAC
    name: データ利用の承認(DAC)
    x: 820
    y: 190
    w: 240
    h: 150
    certainty: spec
    at:
      - [aai/AAIConnectProfile.md, "box \"Data Access Committee\""]
      - [aai/AAIConnectProfile.md, "It is a fairly common situation that, for a single dataset, the Data Access Committee (DAC)"]
    role: 誰がどのデータセットを使ってよいかを決め、その承認を Visa(ControlledAccessGrants、by=dac)にする
    yai: yai-aai の試験用 Visa Issuer が、利用者表に書いた承認を署名する
  - id: B-YAI-AUTH
    name: API の利用許可の発行口
    x: 300
    y: 370
    w: 480
    h: 90
    certainty: open
    reason: WES・TES・DRS は「OAuth2 の Bearer を勧める」とだけ言い、その Bearer を誰が出すか・Passport との関係を決めていない(G-AAI-01・G-AAI-08)
    at:
      - [wes/workflow_execution_service.openapi.yaml, "We recommend that WES implementations use an OAuth2"]
      - [tes/task_execution_service.openapi.yaml, "If authentication is required, we recommend that TES implementations use an OAuth2  bearer token"]
    role: 「その API を使ってよい」を示すアクセストークンを出す(Passport の「そのデータを読んでよい」とは別)
    yai: yai-aai が yai のアクセストークン(RFC 9068 の形、aud はサービスごと)を出す(D-008)
  - id: B-OPS
    name: 計算の運用者
    x: 20
    y: 500
    w: 560
    h: 340
    certainty: open
    reason: WES・TES を誰が運用するか(データを持つ機関の中か、研究者の所属機関か、クラウドか)は GA4GH のどの仕様も決めていない。データを持つ機関との責任の分け方も無い
    at:
      - [wes/workflow_execution_service.openapi.yaml, "The WES implementation is responsible for checking that a user is authorized"]
      - [tes/task_execution_service.openapi.yaml, "Checking that a user is authorized to submit TES requests is a responsibility of TES implementations."]
    role: ワークフローとタスクを受け付けて実行し、出力を置く
    yai: yai-wes・yai-tes・手元のプロセスの実行役(D-024)・普通のファイル置き場(D-003)
  - id: B-DH
    name: データを持つ機関
    x: 620
    y: 500
    w: 440
    h: 240
    certainty: spec
    at:
      - [aai/AAIConnectProfile.md, "holds a specific set of data (or its copy) and respects"]
      - [aai/AAIConnectProfile.md, "box \"Data Holder\""]
    role: データを置き、DAC の決定を守って、誰に渡すかを判断する(Clearinghouse)
    yai: yai-drs(Clearinghouse の部品を中に持つ)と、署名付き URL の配信口

boxes:
  - {id: idp, name: 本人確認(IdP), boundary: B-HOME, x: 320, y: 60, w: 210, h: 56, yai: 試験用の利用者表}
  - {id: vas-home, name: 所属・役割の主張元, boundary: B-HOME, x: 550, y: 60, w: 210, h: 56, yai: 作らない}
  - {id: researcher, name: 研究者, boundary: B-RES, x: 40, y: 220, w: 200, h: 46, kind: person, yai: 自分}
  - {id: client, name: クライアント, boundary: B-RES, x: 40, y: 278, w: 200, h: 46, yai: 試験のコード}
  - {id: broker, name: Broker+Passport Issuer, boundary: B-AAI, x: 420, y: 240, w: 240, h: 56, yai: yai-aai(試験用)}
  - {id: dac, name: DAC(承認する委員会), boundary: B-DAC, x: 840, y: 220, w: 200, h: 46, kind: person, yai: 利用者表に書いた承認}
  - {id: visa-issuer, name: Visa Issuer, boundary: B-DAC, x: 840, y: 278, w: 200, h: 46, yai: yai-aai(試験用)}
  - {id: at-issuer, name: アクセストークンの発行口, boundary: B-YAI-AUTH, x: 520, y: 402, w: 240, h: 46, yai: yai-aai}
  - {id: tes, name: TES, boundary: B-OPS, x: 40, y: 560, w: 220, h: 56, yai: yai-tes}
  - {id: wes, name: WES(+エンジン+DRS の解決役), boundary: B-OPS, x: 320, y: 560, w: 240, h: 56, yai: yai-wes}
  - {id: runner, name: 実行役, boundary: B-OPS, x: 40, y: 670, w: 220, h: 50, yai: 手元のプロセス(D-024)}
  - {id: outstore, name: 出力の置き場, boundary: B-OPS, x: 40, y: 770, w: 220, h: 50, yai: 普通のファイル置き場(D-003)}
  - {id: drs, name: DRS, boundary: B-DH, x: 640, y: 560, w: 190, h: 56, yai: yai-drs}
  - {id: ch, name: Passport Clearinghouse, boundary: B-DH, x: 850, y: 560, w: 190, h: 56, yai: yai-drs の中の部品(本命、D-004)}
  - {id: bytes, name: バイト列の配信口, boundary: B-DH, x: 640, y: 670, w: 190, h: 50, yai: yai-drs の一部(署名付き URL)}

arrows:
  # ── GA4GH の AAI の図にある流れ(yai では作らないものも含む)
  - id: m1
    label: ログインを始める
    from: researcher
    to: client
    kind: call
    certainty: spec
    at: [[aai/AAIConnectProfile.md, "user -> client : Initiates login"]]
  - id: m2
    label: 本人確認を IdP に頼む
    from: broker
    to: idp
    kind: call
    certainty: open
    reason: 「OIDC・SAML などの標準の方式で」とあるだけで、方式も、IdP の結果を Broker がどこまで信じるかも決まっていない
    at: [[aai/AAIConnectProfile.md, "assertions to a Broker using standard protocols, such as OpenID Connect, SAML or"]]
    responsible: IdP は本人であることに責任を持つ。その結果を受け入れるかは Broker の判断
  - id: m3
    label: 所属・役割の主張を渡す
    from: vas-home
    to: broker
    kind: call
    certainty: open
    reason: 主張元から Broker までの仕組みは「この仕様の範囲外」。安全の決まりを守ることだけが MUST
    at: [[aai/AAIConnectProfile.md, "These mechanisms are unspecified by the scope of this specification except that"]]
    responsible: 主張の中身は主張元(所属機関)。Visa に署名した者が、その Visa の中身を主張したことになる
  - id: m4
    label: 承認を Visa の材料に
    from: dac
    to: visa-issuer
    kind: call
    certainty: open
    reason: DAC の決定を Visa Issuer に伝える仕組みは仕様の範囲外(主張元 → Visa Issuer の流れ)
    at: [[aai/AAIConnectProfile.md, "These mechanisms are unspecified by the scope of this specification except that"]]
  - id: m5
    label: Visa を渡す
    from: visa-issuer
    to: broker
    kind: call
    certainty: open
    reason: 公式の図そのものに「protocol unspecified」と書いてある
    at: [[aai/AAIConnectProfile.md, "broker <-> issuer : Exchange of visas, if needed (protocol unspecified)"]]
    responsible: Visa の署名は Visa Issuer。Broker は署名を保ったまま運ぶだけ(中身を変えられない)
  - id: m6
    label: DAC の決定を守る
    from: dac
    to: drs
    kind: trust
    certainty: spec
    via: [[810, 243], [800, 480]]
    at: [[aai/AAIConnectProfile.md, "and enforces the Data Access Committee's (DAC's) decisions on who can access it."]]
    responsible: 決めるのは DAC、守る(執行する)のはデータを持つ機関
  - id: m7
    label: 信じる Broker を選ぶ
    from: ch
    to: broker
    kind: trust
    certainty: spec
    at: [[aai/AAIConnectProfile.md, "Passport Clearinghouses MUST trust at least one Broker."]]
    responsible: どの Broker を信じるかの危険の見積もりは Clearinghouse(データを持つ機関)の責任
  # ── yai の 4 つを組み合わせた流れ(system.md 4 節の ①〜⑯)
  - id: a01
    sys: ①
    label: ログイン → PSAT
    tag_at: 0.4
    from: client
    to: broker
    kind: call
    certainty: spec
    at: [[aai/AAIConnectProfile.md, "client -> broker : Request Passport-Scoped Access Token with code and client credentials"]]
    responsible: 本人確認と PSAT の発行は Broker。PSAT をほかへ出さないのはクライアント
    yai: 試験用ログイン(固定の利用者表)。認可コードの流れは後(G-AAI-09)
  - id: a02
    sys: ②
    label: Token Exchange → Passport
    tag_at: 0.4
    from: client
    to: broker
    kind: call
    certainty: spec
    at: [[aai/AAIConnectProfile.md, "client -> broker : Request to exchange Passport-Scoped Access Token for Passport"]]
    responsible: Passport に入れる Visa を選んで署名するのは Broker(Passport Issuer)
  - id: a03
    sys: ③
    label: API の利用許可(AT)
    tag_at: 0.3
    from: client
    to: at-issuer
    kind: call
    certainty: yai
    decision: D-008
    responsible: AT を出すのは発行口。どの API を使ってよいかは scope と aud で表す
  - id: a04
    sys: ④
    label: RunWorkflow(AT+yai_passports)
    tag_at: 0.6
    from: client
    to: wes
    kind: call
    certainty: yai
    decision: D-009
    responsible: 利用者は Passport を WES に預ける。WES は預かった Passport を run の間だけ持ち、ログに出さない
  - id: a56
    sys: ⑤⑥
    label: POST /objects・/access(passports)
    from: wes
    to: drs
    badge_at: [-26, 24]
    kind: call
    certainty: yai
    decision: D-007
    responsible: 送ってよい DRS かの判断は WES。Passport を受け入れて渡すかの判断は DRS(Clearinghouse)
  - id: a07b
    sys: ⑦
    label: Passport の鍵(JWKS)
    from: ch
    to: broker
    kind: call
    certainty: spec
    at: [[aai/AAIConnectProfile.md, "2. For Passport flows, Passport Clearinghouses MUST check the validity of the Passport."]]
    responsible: 鍵を公開するのは Broker。どの鍵を信じるかは Clearinghouse
  - id: a07v
    sys: ⑦
    label: Visa の鍵(jku)
    from: ch
    to: visa-issuer
    kind: call
    certainty: spec
    at:
      - [aai/AAIConnectProfile.md, "clearing -> issuer : Request public keys"]
      - [aai/AAIConnectProfile.md, "keys to verify the signature, then it MUST verify that the `jku` is"]
    responsible: 鍵の公開は Visa Issuer。jku を取りに行く前に許可表で確かめるのは Clearinghouse
  - id: a08
    sys: ⑧
    label: 署名付き URL
    from: drs
    to: wes
    badge_at: [-24, -40]
    kind: call
    certainty: spec
    at: [[drs/openapi/tags/Auth.md, "server provides an `access_url` with the generated mechanism (e.g. a signed URL in the `url` field)"]]
    responsible: URL を出すのは DRS。期限までは誰が持っていても使える(期限は仕様に欄が無い、G-DRS-10)
  - id: a09
    sys: ⑨
    label: サービスの AT(client_credentials)
    tag_at: 0.78
    from: wes
    to: at-issuer
    kind: call
    certainty: yai
    decision: D-010
    responsible: WES は自分のサービスの身元で TES に出す。秘密は設定ファイルに置き git に入れない
  - id: a10
    sys: ⑩
    label: CreateTask(入力は署名付き URL)
    from: wes
    to: tes
    badge_at: [-27, -42]
    kind: call
    certainty: yai
    decision: D-010
    responsible: タスクの持ち主は WES のサービス。利用者は tags の yai.on_behalf_of に書くだけ
  - id: a13
    sys: ⑬
    label: GetTask(view=FULL)・CancelTask
    from: wes
    to: tes
    badge_at: [-27, 22]
    kind: call
    certainty: yai
    decision: D-010
  - id: t1
    label: 実行を頼む
    from: tes
    to: runner
    kind: call
    certainty: yai
    decision: D-024
  - id: a11
    sys: ⑪
    label: URL からバイト列を取る
    from: runner
    to: bytes
    kind: call
    certainty: yai
    decision: D-007
    responsible: URL そのものが資格情報。配信口は持ち主を区別できない。漏れたときの責任の分け方は決まっていない
  - id: a12
    sys: ⑫
    label: 出力を置く
    from: runner
    to: outstore
    kind: call
    certainty: yai
    decision: D-003
  - id: a14
    sys: ⑭
    label: 状態・ログ・タスクの一覧
    tag_at: 0.3
    from: client
    to: wes
    kind: call
    certainty: spec
    at: [[wes/workflow_execution_service.openapi.yaml, "The WES implementation is responsible for checking that a user is authorized"]]
    responsible: 誰に見せるかの判断は WES の実装(仕様は「実装の責任」とだけ)
  - id: a15
    sys: ⑮
    label: TES を直接読む(tes_uri)
    tag_at: 0.55
    from: client
    to: tes
    kind: call
    certainty: spec
    at: [[tes/task_execution_service.openapi.yaml, "Checking that a user is authorized to submit TES requests is a responsibility of TES implementations."]]
    responsible: 誰に見せるかの判断は TES の実装。WES が出したタスクを利用者が読めるかは yai が決めた(C-12)
  - id: a16
    sys: ⑯
    label: DRS を直接使う
    tag_at: 0.5
    from: client
    to: drs
    kind: call
    certainty: spec
    at: [[drs/openapi/tags/Auth.md, "The DRS implementation is responsible for defining and enforcing an authorization policy"]]
    responsible: 認可の方針を決めて執行するのは DRS の実装

