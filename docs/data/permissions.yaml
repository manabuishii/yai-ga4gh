# 操作ごとの認可の表(4 つの役のうち「資源と操作ごとに許すかを決める」の中身。docs/design/aai.md 5 節)
# credential: 受ける資格情報の種類(aai.md 3 節の表の名前)。none=要らない
# scope: AT の scope に要るもの / owner: 資源の持ち主との関係
#   self=持ち主本人(AT の sub。サービスが代理で出したものも持ち主は利用者、D-067) / actor=代理で出したサービス本人(AT の act.sub、自分の AT で) / service=作ったサービス本人
# not_visible: 見えないときの応答(D-013)
# 設計の正(D-006)。実装は実行時に読むかコードに写す。表に無い操作は拒否(403)
tokens:
  at_user:    {kind: yai-access-token, sub_kind: user}
  at_service: {kind: yai-access-token, sub_kind: service}
  passport:   {kind: passport}
drs:
  # DRS は「方針(policy)ごとに、受ける資格情報と条件」を持つ(レビューで組み直した)
  # 操作 → どちらの方針で判定するか。方針の中身は下の policies
  operations:
    GetServiceInfo:    {policy: always}
    OptionsObject:     {policy: always}                 # 仕様で security: [{}]
    OptionsBulkObject: {policy: always}
    GetObject:         {policy: object.metadata_policy}
    PostObject:        {policy: object.metadata_policy}
    GetBulkObjects:    {policy: object.metadata_policy, note: 1 件ずつ判定し、だめなものは unresolved に 403}
    GetAccessURL:      {policy: object.access_policy}
    PostAccessURL:     {policy: object.access_policy}
    GetBulkAccessURL:  {policy: object.access_policy}
    BlobDelivery:      {policy: object.access_policy, note: 配信口。public 以外は署名付き URL の署名だけで判定}
  policies:
    always:  {accept: [none, at_user, at_service, passport]}
    public:  {accept: [none, at_user, at_service, passport], note: 資格情報が付いていても検査に失敗したら 401(壊れた資格情報を黙って無視しない)}
    bearer:  {accept: [at_user, at_service], require: {aud: yai-drs, scope_any: [drs.read, drs.access]}}
    dataset: {accept: [passport], require: {visa: ControlledAccessGrants, value_equals: object.dataset}, note: AT では通らない(利用者の Visa が要る、C-19)}
  multiple_credentials: >-
    1 つの要求に複数の資格情報(Bearer と passports、複数の Passport)が来たら、それぞれを別々に検査し、
    どれか 1 つだけで方針を満たせば許す。別々の資格情報の属性(Visa など)を合わせて判定しない。
    どれかの検査が失敗したら(壊れている・信頼しない)要求全体を 401(PP-CH-01)
tes:
  GetServiceInfo:   {credential: [none]}
  CreateTask:       {credential: [at_user, at_service], scope: [tes.submit], note: "持ち主は AT の sub、代理は act.sub(D-067)。yai. の tags は yai.run_id・yai.submit_nonce だけで、誰でも付けられる(D-071)。yai.on_behalf_of は 400。drs:// の入力は drs.enabled のときだけ、利用者の PSAT で(D-069)"}
  ListTasks:        {credential: [at_user, at_service], scope: [tes.read], owner: [self, actor], note: "見えるものだけを返す。self は自分の AT なら自分のタスク全部、交換した AT(act 付き)なら同じ(持ち主, 代理)の組だけ(D-067)"}
  GetTask:          {credential: [at_user, at_service], scope: [tes.read], owner: [self, actor], not_visible: 404, note: "self の意味は ListTasks と同じ"}
  CancelTask:       {credential: [at_user, at_service], scope: [tes.cancel], owner: [self, actor], not_visible: 404, visible_but_not_owner: 403, note: "self は「同じ持ち主+同じ代理」の組(利用者本人は代理で出されたものを取り消せない)"}
wes:
  GetServiceInfo:   {credential: [none]}
  ListRuns:         {credential: [at_user], scope: [wes.read], owner: [self]}
  RunWorkflow:      {credential: [at_user], scope: [wes.run], note: multipart の yai_passports は任意(dataset の方針の入力があるときに要る)}
  GetRunLog:        {credential: [at_user], scope: [wes.read], owner: [self], not_visible: 404}
  GetRunStatus:     {credential: [at_user], scope: [wes.read], owner: [self], not_visible: 404}
  ListTasks:        {credential: [at_user], scope: [wes.read], owner: [self], not_visible: 404}
  GetTask:          {credential: [at_user], scope: [wes.read], owner: [self], not_visible: 404}
  CancelRun:        {credential: [at_user], scope: [wes.cancel], owner: [self], not_visible: 404}
  GetTaskStdout:    {credential: [at_user], scope: [wes.read], owner: [self], not_visible: 404, note: yai 独自(C-08)}
  GetTaskStderr:    {credential: [at_user], scope: [wes.read], owner: [self], not_visible: 404, note: yai 独自(C-08)}
