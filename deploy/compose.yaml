# Environment of the combined yai tests (test-plan.md section 5, system.md section 2; D-035, layout D-037).
# Runs on a local rootless Docker since stage 2. Usage: deploy/README.md
#
# To work with any daemon layout (rootless Docker, Podman, a dedicated VM, dind):
# - no --privileged, network_mode: host or pid: host; never mount the rootful daemon's socket (under /var/run)
# - where the yai-tes runner starts containers is passed as YAI_DOCKER_HOST (DOCKER_HOST). For a unix
#   socket, its directory is mounted read-only from YAI_DOCKER_SOCK_DIR (path as the daemon sees it, D-037)
# - only the proxy is published, by default on 127.0.0.1:8443 (>= 1024, a variable); 443 inside the network
# - every bind mount source is under YAI_LOCAL_DIR (written by setup.sh). It must be where the daemon
#   sees it, as a checkout inside a development container may be invisible to the daemon (D-037).
#   Defaults keep `docker compose config` working without any variables
name: ${YAI_PROJECT:-yai}

x-yai: &yai
  image: ${YAI_IMAGE:-yai:dev}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: base
    args:
      YAI_UID: ${YAI_UID:-10001}
      YAI_GID: ${YAI_GID:-10001}
  user: "${YAI_UID:-10001}:${YAI_GID:-10001}"
  restart: "no"
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment:
    SSL_CERT_FILE: /yai/local/certs/ca.pem   # trust only the local CA (read by httpx)
  networks: [yai]

services:
  aai:
    <<: *yai
    command: [yai, serve, aai, --config, /yai/local/config/aai.yaml, --host, 0.0.0.0, --port, "8401"]
    volumes:
      - ${YAI_LOCAL_DIR:-./local}:/yai/local:ro
      - aai-data:/yai/var/aai

  drs:
    <<: *yai
    command: [yai, serve, drs, --config, /yai/local/config/drs.yaml, --host, 0.0.0.0, --port, "8402"]
    volumes:
      - ${YAI_LOCAL_DIR:-./local}:/yai/local:ro
      - drs-data:/yai/var/drs

  tes:
    <<: *yai
    command: [yai, serve, tes, --config, /yai/local/config/tes.yaml, --host, 0.0.0.0, --port, "8403"]
    volumes:
      - ${YAI_LOCAL_DIR:-./local}:/yai/local:ro
      - tes-data:/yai/var/tes/db
      - tes-files:/yai/var/tes/files
      - ${YAI_TES_WORK_DIR:-./local/tes-work}:/yai/var/tes/work

  tes-worker:
    <<: *yai
    command: [yai, tes, worker, --config, /yai/local/config/tes.yaml]
    environment:
      SSL_CERT_FILE: /yai/local/certs/ca.pem
      # where the runner connects with the docker CLI: a rootless daemon (the socket in
      # YAI_DOCKER_SOCK_DIR below), a dedicated VM (tcp:// or ssh://) or a dind endpoint
      DOCKER_HOST: ${YAI_DOCKER_HOST:-}
      # The working directory as the Docker daemon sees it (host side of -v): the same place as the
      # bind mount source above, as an absolute path seen by the daemon (may differ between a
      # development container, the host and dind). D-034
      YAI_TES_HOST_WORK_DIR: ${YAI_TES_WORK_DIR_FOR_DOCKER:-/srv/yai/tes-work}
    volumes:
      - ${YAI_LOCAL_DIR:-./local}:/yai/local:ro
      - tes-data:/yai/var/tes/db
      - tes-files:/yai/var/tes/files
      - ${YAI_TES_WORK_DIR:-./local/tes-work}:/yai/var/tes/work
      # directory with the daemon's socket (rootless; stays an empty directory for tcp://)
      - ${YAI_DOCKER_SOCK_DIR:-./local/docker-sock}:/run/yai-docker:ro

  wes:
    <<: *yai
    command: [yai, serve, wes, --config, /yai/local/config/wes.yaml, --host, 0.0.0.0, --port, "8404"]
    volumes:
      - ${YAI_LOCAL_DIR:-./local}:/yai/local:ro
      - wes-data:/yai/var/wes

  proxy:
    image: ${YAI_CADDY_IMAGE:-caddy:2.11.7-alpine}
    restart: "no"
    read_only: true
    tmpfs: [/tmp, /config, /data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # port 443 inside the network
    volumes:
      - ${YAI_LOCAL_DIR:-./local}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro   # copied from deploy/caddy/ by setup.sh
      - ${YAI_LOCAL_DIR:-./local}/certs:/certs:ro
    ports:
      - "${YAI_BIND:-127.0.0.1}:${YAI_HTTPS_PORT:-8443}:443"
    networks:
      yai:
        aliases: [aai.yai.test, drs.yai.test, tes.yai.test, wes.yai.test]
    depends_on: [aai, drs, tes, tes-worker, wes]

  # registers the test data in DRS (runs once; the test observer, D-023)
  seed:
    <<: *yai
    profiles: [seed]
    command: [python, /yai/seed.py]
    volumes:
      - ${YAI_LOCAL_DIR:-./local}:/yai/local:ro
      - ${YAI_LOCAL_DIR:-./local}/seed/seed.py:/yai/seed.py:ro   # copied by setup.sh
      - ${YAI_LOCAL_DIR:-./local}/seed/testdata:/yai/testdata:ro
      - drs-data:/yai/var/drs
      - e2e-state:/yai/e2e

networks:
  yai:
    name: ${YAI_NETWORK:-yai-net}

volumes:
  aai-data:
  drs-data:
  tes-data:
  wes-data:
  tes-files:
    name: ${YAI_PROJECT:-yai}-tes-files
  e2e-state:
    name: ${YAI_PROJECT:-yai}-e2e-state
