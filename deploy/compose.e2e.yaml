# Test container (calls over HTTP from outside the stack; test-plan.md section 5, D-023). D-035, D-037
# Runs as a project separate from the main one (compose.yaml) and joins the same network from outside:
#   docker compose -f deploy/compose.e2e.yaml run --rm e2e
# observations (IDs registered in DRS, the TES output store) are mounted read-only
name: ${YAI_PROJECT:-yai}-e2e

services:
  e2e:
    image: ${YAI_TEST_IMAGE:-yai-test:dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: test
      args:
        YAI_UID: ${YAI_UID:-10001}
        YAI_GID: ${YAI_GID:-10001}
    user: "${YAI_UID:-10001}:${YAI_GID:-10001}"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    working_dir: /yai/app
    command: [python, -m, pytest, -q, -p, no:cacheprovider, -m, "e2e or docker",
              tests/test_e2e.py, --junitxml=/yai/results/junit-compose.xml]
    environment:
      SSL_CERT_FILE: /yai/local/certs/ca.pem
      YAI_E2E_TARGET: compose               # the tests call https://*.yai.test
      YAI_E2E_DOCKER: "1"                   # also run the tests marked docker
      YAI_E2E_IDS: /yai/e2e/ids.json
      YAI_E2E_TES_FILES: /yai/obs/tes-files
      YAI_E2E_SECRETS: /yai/local/secrets
      DOCKER_HOST: ${YAI_DOCKER_HOST:-}      # the docker-marked tests (no leftover containers, limits) call docker
    volumes:
      - ${YAI_LOCAL_DIR:-./local}:/yai/local:ro
      - e2e-state:/yai/e2e:ro
      - tes-files:/yai/obs/tes-files:ro
      - ${YAI_DOCKER_SOCK_DIR:-./local/docker-sock}:/run/yai-docker:ro
      - ${YAI_LOCAL_DIR:-./local}/results:/yai/results   # junit out of the container (tools/compose_e2e.sh copies it to build/)
    networks: [yai]

networks:
  yai:
    name: ${YAI_NETWORK:-yai-net}
    external: true

volumes:
  e2e-state:
    name: ${YAI_PROJECT:-yai}-e2e-state
    external: true
  tes-files:
    name: ${YAI_PROJECT:-yai}-tes-files
    external: true
